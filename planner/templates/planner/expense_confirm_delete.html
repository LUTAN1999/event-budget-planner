{% extends 'planner/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 text-center">
            <h4 class="text-danger mb-3">Delete Expense?</h4>
            <p>Are you sure you want to delete <strong>{{ expense.title }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100">Yes, Delete</button>
            </form>
            <a href="{% url 'event_detail' expense.category.event.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
