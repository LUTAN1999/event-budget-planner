{% extends 'planner/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-4">Add Vendor</h3>
            <p class="text-muted">Event: <strong>{{ event.name }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Vendor Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="e.g. Sharma Caterers" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Service</label>
                    <input type="text" name="service" class="form-control"
                           placeholder="e.g. Catering, Photography, Decoration" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control"
                           placeholder="e.g. 75000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contact Number</label>
                    <input type="text" name="contact" class="form-control"
                           placeholder="e.g. 9876543210">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="paid" class="form-check-input" id="paidCheck">
                    <label class="form-check-label" for="paidCheck">Already Paid</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Vendor</button>
                <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
