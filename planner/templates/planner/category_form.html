{% extends 'planner/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-4">Add Category</h3>
            <p class="text-muted">Event: <strong>{{ event.name }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="e.g. Catering, Decoration, Photography" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Allocated Budget (₹)</label>
                    <input type="number" name="allocated_budget" class="form-control"
                           placeholder="e.g. 100000" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Category</button>
                <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
