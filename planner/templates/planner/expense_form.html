{% extends 'planner/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-4">{% if expense %}Edit Expense{% else %}Add Expense{% endif %}</h3>
            <p class="text-muted">Category: <strong>{{ category.name }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" name="title" class="form-control"
                           value="{{ expense.title }}" placeholder="e.g. Catering deposit" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control"
                           value="{{ expense.amount }}" placeholder="e.g. 25000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="date" name="date" class="form-control"
                           value="{{ expense.date }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="pending" {% if expense.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="paid" {% if expense.status == 'paid' %}selected{% endif %}>Paid</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Note (optional)</label>
                    <textarea name="note" class="form-control" rows="2"
                              placeholder="Any extra details...">{{ expense.note }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    {% if expense %}Update Expense{% else %}Add Expense{% endif %}
                </button>
                <a href="{% url 'event_detail' category.event.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
